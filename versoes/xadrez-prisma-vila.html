<!doctype html>
<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2d2a3e; --dim:#6b6884; --red:#d94a3d; --blue:#3a6fd8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    background: linear-gradient(180deg, #6fc0f2 0%, #a9dcfa 45%, #dcf2ff 80%, #eefaff 100%);
    font-family:'Fredoka', system-ui, sans-serif; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; top:20px; left:20px; pointer-events:none; width:min(300px, calc(100vw - 32px));
    background:rgba(255,255,255,.86); border-radius:20px; padding:16px 18px 14px;
    box-shadow:0 6px 0 rgba(60,110,150,.18), 0 16px 34px rgba(40,90,140,.16); }
  .t1 { font-weight:700; font-size:22px; letter-spacing:.03em; }
  .t2 { font-size:12px; color:var(--dim); margin-top:2px; }
  .lead { height:3px; border-radius:3px; background:linear-gradient(90deg, var(--red), var(--blue)); margin:12px 0; opacity:.8; }
  .turn { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; }
  .dot { width:16px; height:16px; border-radius:50%; background:var(--red); border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.08); transition:.3s; }
  #status { color:#e0352b; font-weight:700; font-size:14px; margin-top:6px; min-height:18px; letter-spacing:.06em; }
  #info { font-size:14px; color:var(--dim); margin-top:4px; line-height:1.45; min-height:40px; }
  #info b { color:var(--ink); font-weight:600; }
  #last { font-size:12px; color:var(--dim); margin-top:6px; }
  #controls { position:fixed; right:20px; bottom:20px; display:flex; gap:10px; }
  button { font:inherit; font-weight:600; font-size:15px; color:var(--ink); background:#fff; border:none;
    padding:10px 16px; border-radius:14px; cursor:pointer; box-shadow:0 4px 0 #b9cfe0, 0 8px 18px rgba(40,90,140,.15); transition:transform .1s, box-shadow .1s; }
  button:hover { background:#fffbea; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #b9cfe0; }
  #help { position:fixed; left:20px; bottom:20px; font-size:13px; color:var(--ink); background:rgba(255,255,255,.7); padding:8px 12px; border-radius:12px; }
  #overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(30,60,100,.32); backdrop-filter:blur(3px); }
  #overlay[hidden] { display:none; }
  .card { text-align:center; padding:30px 40px; border-radius:24px; background:#fff; box-shadow:0 8px 0 #b9cfe0, 0 24px 50px rgba(20,50,90,.25); }
  .card h2 { margin:0 0 6px; font-size:30px; letter-spacing:.06em; }
  .card p { color:var(--dim); margin:0 0 20px; font-size:16px; }
  @media (max-width:600px) {
    #hud { top:12px; left:12px; padding:12px 14px; } #controls { right:12px; bottom:12px; } #help { display:none; }
    .t1 { font-size:18px; } #info { min-height:0; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="hud">
  <div class="t1">XADREZ PRISMA</div>
  <div class="t2">a vila · câmera isométrica</div>
  <div class="lead"></div>
  <div class="turn"><span class="dot" id="dot"></span><span id="turnTxt">Vez do Vermelho</span></div>
  <div id="status"></div>

  <div id="last"></div>
</div>

  <button id="rotL" title="Girar (Q)">⟲</button>

</div>
<div id="overlay" hidden><div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="ovBtn">Jogar de novo</button></div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- Renderer / cena / câmera isométrica ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10, 10, 6, -6, 0.1, 100);
const EL = Math.atan(1 / Math.SQRT2);   // elevação isométrica (~35,26°)
const DIST = 30;
let camAng = Math.PI / 4, camTarget = camAng;
camera.zoom = 1.25;

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  let hw = 10.5, hh = hw / a;
  if (hh < 6.4) { hh = 6.4; hw = hh * a; }
  if (hw < 7.8) { hw = 7.8; hh = hw / a; }   // telas em pé: garante o tabuleiro inteiro
  Object.assign(camera, { left: -hw, right: hw, top: hh, bottom: -hh });
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resize); resize();

// ---------- Luzes ----------
scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x8a6a4a, 1.6));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(-6, 13, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd8ff, 0.6); fill.position.set(8, 6, -6); scene.add(fill);

// ---------- Utilidades de modelagem ----------
const world = new THREE.Group(); scene.add(world);
const std = (color, roughness = 0.75, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0, ...extra });
function part(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; }
const box = (w, h, d, mat, x, y, z) => part(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
const ball = (r, mat, x, y, z, s = 16) => part(new THREE.SphereGeometry(r, s, Math.max(6, (s * 0.75) | 0)), mat, x, y, z);
const rod = (r, h, mat, x, y, z, s = 10) => part(new THREE.CylinderGeometry(r, r, h, s), mat, x, y, z);
const cone = (r, h, mat, x, y, z, s = 8) => part(new THREE.ConeGeometry(r, h, s), mat, x, y, z);
// cilindro com cantos arredondados (o "feijão" dos bonecos)
function capsule(r, h, rb = 0, rt = 0) {
  const V = THREE.Vector2, pts = [new V(0, 0)], n = 7;
  if (rb > 0) for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + (i / n) * Math.PI / 2; pts.push(new V(r - rb + Math.cos(a) * rb, rb + Math.sin(a) * rb)); }
  else pts.push(new V(r, 0));
  if (rt > 0) for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI / 2; pts.push(new V(r - rt + Math.cos(a) * rt, h - rt + Math.sin(a) * rt)); }
  else pts.push(new V(r, h));
  pts.push(new V(0, h));
  return new THREE.LatheGeometry(pts, 32);
}
const seg = (y, h, r, mat, rb = 0, rt = 0) => part(capsule(r, h, rb, rt), mat, 0, y, 0);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- Materiais ----------
const M = {
  skin: std(0xf5c7a1, .8), nose: std(0xeaa985, .8), blush: std(0xf3968a, .9),
  ink: std(0x2b1d1a, .45), white: std(0xfbf8f2, .6),
  metal: std(0xc3cad6, .35, { metalness: .25 }), metalDark: std(0x8d96a5, .4, { metalness: .25 }),
  gold: std(0xf3c04a, .35, { metalness: .2 }), goldD: std(0xf3c04a, .35, { metalness: .2, side: THREE.DoubleSide }),
  wood: std(0xa86c3a, .85), woodD: std(0x6e4224, .85), leather: std(0x6b4026, .8),
  cloth: std(0xe2cfa2, .9), clothD: std(0xb89c66, .9),
  hairBlond: std(0xebb74e, .7, { side: THREE.DoubleSide }), hairBrown: std(0x6f4126, .7), beard: std(0xf1ece3, .85),
  leaf: std(0x63c24a, .8), leaf2: std(0x4aa53d, .8), pine: std(0x2f8e57, .8), trunk: std(0x8a5a32, .9),
  stone: std(0xb1b8c2, .9, { flatShading: true }), wall: std(0xf7ecd6, .85), roofR: std(0xe25b4b, .7), roofB: std(0x4e88dc, .7),
  glass: std(0x9fdcff, .2, { emissive: 0x3a86b8, emissiveIntensity: .3 }), hay: std(0xeac65c, .9),
  water: std(0x48b3ef, .15, { transparent: true, opacity: .9 }), duck: std(0xffd84a, .6), beak: std(0xff8a2a, .6),
  dirt: std(0xd38f4f, .95), dirt2: std(0x9c6137, .95), cloud: std(0xffffff, 1, { emissive: 0xffffff, emissiveIntensity: .35 }),
};

// ---------- Tabuleiro diorama ----------
const sqPos = (c, r) => new THREE.Vector3(c - 3.5, 0.05, r - 3.5);
const tiles = [];
const decor = new THREE.Group(); world.add(decor);
const gTop = new RoundedBoxGeometry(.96, .2, .96, 3, .06);
const gMid = new RoundedBoxGeometry(.96, .46, .96, 2, .06);
const gLow = new RoundedBoxGeometry(.96, .32, .96, 2, .06);
const isBorder = (c, r) => c < 0 || c > 7 || r < 0 || r > 7;
const POND = [8, 8];

for (let c = -1; c <= 8; c++) for (let r = -1; r <= 8; r++) {
  const x = c - 3.5, z = r - 3.5, border = isBorder(c, r);
  const pond = c === POND[0] && r === POND[1];
  let col;
  if (border) col = new THREE.Color(0x86c94f);
  else col = new THREE.Color((c + r) % 2 === 0 ? 0x5fae3c : 0x9bd65b);
  col.offsetHSL((rnd() - .5) * .015, 0, (rnd() - .5) * .05);
  const top = new THREE.Mesh(gTop, pond ? M.water : std(col, .85));
  top.position.set(x, pond ? -.1 : -.05, z); top.receiveShadow = true;
  if (border) decor.add(top); else { top.userData.sq = [c, r]; tiles.push(top); world.add(top); }
  const mid = new THREE.Mesh(gMid, M.dirt); mid.position.set(x, -.37 - rnd() * .02, z); mid.castShadow = true; mid.receiveShadow = true; decor.add(mid);
  const low = new THREE.Mesh(gLow, M.dirt2); low.position.set(x, -.74 - rnd() * .04, z); low.castShadow = true; decor.add(low);
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.6; ground.receiveShadow = true; world.add(ground);

// ---------- Cenário (fica só na borda, fora das casas jogáveis) ----------
const ambient = [];   // animações do cenário
function at(c, r, obj, dx = 0, dz = 0, s = 1, ry = 0) { obj.position.set(c - 3.5 + dx, .05, r - 3.5 + dz); obj.scale.setScalar(s); obj.rotation.y = ry; decor.add(obj); return obj; }
const grp = (...kids) => { const g = new THREE.Group(); kids.forEach(k => g.add(k)); return g; };
const tree = () => grp(rod(.06, .36, M.trunk, 0, .18, 0), ball(.26, M.leaf, 0, .52, 0, 14), ball(.19, M.leaf2, .16, .44, .09, 12), ball(.17, M.leaf, -.14, .45, -.07, 12), ball(.15, M.leaf2, .02, .72, .02, 12));
const pine = () => grp(rod(.05, .2, M.trunk, 0, .1, 0), cone(.3, .34, M.pine, 0, .33, 0), cone(.23, .3, M.pine, 0, .53, 0), cone(.15, .26, M.pine, 0, .72, 0));
const bush = () => grp(ball(.16, M.leaf, 0, .1, 0, 12), ball(.13, M.leaf2, .14, .07, .06, 12), ball(.11, M.leaf, -.12, .06, .08, 10));
function rock() { const a = part(new THREE.DodecahedronGeometry(.17), M.stone, 0, .06, 0); a.scale.set(1.2, .7, 1); const b = part(new THREE.DodecahedronGeometry(.09), M.stone, .2, .03, .12); return grp(a, b); }
function flowers(n = 6) {
  const g = new THREE.Group(), cols = [0xff6b8b, 0xffd84d, 0xffffff, 0xb08cff, 0xff9a3d];
  for (let i = 0; i < n; i++) {
    const x = (rnd() - .5) * .7, z = (rnd() - .5) * .7;
    g.add(rod(.007, .1, M.leaf2, x, .05, z, 5), ball(.032, std(cols[(rnd() * cols.length) | 0], .6), x, .11, z, 8));
  }
  return g;
}
function tufts(n = 4) { const g = new THREE.Group(); for (let i = 0; i < n; i++) g.add(cone(.03, .1, M.leaf2, (rnd() - .5) * .8, .05, (rnd() - .5) * .8, 4)); return g; }
function mushrooms() {
  const g = new THREE.Group(), cap = std(0xe8463b, .6);
  for (const [x, z, s] of [[0, 0, 1], [.13, .08, .7], [-.1, .12, .6]]) {
    const m = grp(rod(.03, .1, M.white, 0, .05, 0), part(new THREE.SphereGeometry(.08, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), cap, 0, .09, 0), ball(.015, M.white, .03, .15, .04, 6));
    m.position.set(x, 0, z); m.scale.setScalar(s); g.add(m);
  }
  return g;
}
function house(roof) {
  const r = part(new THREE.CylinderGeometry(.36, .36, .74, 3, 1, false, Math.PI / 2), roof, 0, .6, 0); r.rotation.z = Math.PI / 2;
  return grp(box(.62, .42, .5, M.wall, 0, .21, 0), r, box(.14, .22, .03, M.woodD, 0, .11, .25),
    box(.12, .12, .03, M.glass, -.2, .25, .25), box(.12, .12, .03, M.glass, .2, .25, .25), box(.09, .22, .09, M.stone, .17, .82, -.08));
}
function well() {
  const rf = cone(.3, .2, M.roofR, 0, .56, 0, 4); rf.rotation.y = Math.PI / 4;
  return grp(part(new THREE.CylinderGeometry(.2, .22, .2, 14), M.stone, 0, .1, 0), part(new THREE.CylinderGeometry(.16, .16, .02, 14), M.water, 0, .19, 0),
    rod(.022, .46, M.wood, -.18, .23, 0), rod(.022, .46, M.wood, .18, .23, 0), rod(.015, .38, M.woodD, 0, .38, 0), rf);
}
function barrel() { const g = grp(rod(.1, .22, M.wood, 0, .11, 0, 12)); for (const y of [.05, .17]) { const t = part(new THREE.TorusGeometry(.102, .01, 4, 16), M.metalDark, 0, y, 0); t.rotation.x = Math.PI / 2; g.add(t); } return g; }
function hay() { const h = part(new THREE.CylinderGeometry(.15, .15, .26, 14), M.hay, 0, .15, 0); h.rotation.z = Math.PI / 2; return grp(h); }
function lamp() { return grp(rod(.02, .5, M.ink, 0, .25, 0, 6), box(.09, .11, .09, std(0xffe7a0, .5, { emissive: 0xffc94a, emissiveIntensity: .8 }), 0, .55, 0), cone(.08, .07, M.ink, 0, .64, 0, 4)); }
function fence(len) {
  const g = new THREE.Group();
  for (let x = -len / 2; x <= len / 2 + .01; x += .5) g.add(box(.05, .26, .05, M.wood, x, .13, 0));
  g.add(box(len, .035, .025, M.wood, 0, .09, 0), box(len, .035, .025, M.wood, 0, .19, 0));
  return g;
}
function duck() {
  const g = grp(ball(.07, M.duck, 0, 0, 0, 12), ball(.045, M.duck, 0, .07, .05, 10), cone(.018, .05, M.beak, 0, .065, .1, 6), ball(.008, M.ink, .025, .085, .08, 6), ball(.008, M.ink, -.025, .085, .08, 6));
  g.children[0].scale.set(1, .8, 1.3); g.children[2].rotation.x = Math.PI / 2; return g;
}

// coluna esquerda (c = -1) e direita (c = 8)
at(-1, -1, house(M.roofR), 0, 0, 1, 0);
at(-1, 0, bush(), .1, -.1); at(-1, 0, flowers(5), 0, .1);
at(-1, 1, tree(), 0, 0, .95);
at(-1, 2, rock(), 0, 0); at(-1, 2, tufts());
at(-1, 3, pine(), 0, 0, .9);
at(-1, 4, mushrooms(), 0, 0); at(-1, 4, flowers(4));
at(-1, 5, tree(), 0, 0, .85);
at(-1, 6, hay(), -.05, -.1, 1, .4); at(-1, 6, barrel(), .2, .22);
at(-1, 7, lamp(), 0, 0);
at(-1, 8, pine(), 0, 0, .8); at(-1, 8, bush(), .2, .25, .7);
at(8, -1, tree(), 0, 0, 1.05); at(8, -1, bush(), .25, .25, .7);
at(8, 0, pine(), 0, 0, .85);
at(8, 1, flowers(7));
at(8, 2, well());
at(8, 3, bush()); at(8, 3, tufts());
at(8, 4, house(M.roofB), 0, 0, .85, -Math.PI / 2);
at(8, 5, rock()); at(8, 5, flowers(4));
at(8, 6, tree(), 0, 0, .9);
at(8, 7, lamp());
// lago no canto, com patinho
{
  const pad = part(new THREE.CylinderGeometry(.11, .11, .015, 12, 1, false, .4, Math.PI * 1.8), M.leaf, -.2, -.0, -.15);
  at(...POND, grp(pad, ball(.03, std(0xff9bc2, .6), -.2, .02, -.15, 8))).position.y = 0;
  const d = at(...POND, duck(), .12, .12); d.position.y = .02;
  ambient.push(t => { d.position.y = .02 + Math.sin(t * 2.2) * .012; d.rotation.y = Math.sin(t * .5) * 1.2; });
}
// bordas de trás e da frente: cerca, e as peças capturadas ficam sentadas ali
for (const s of [-1, 1]) { const f = fence(8); f.position.set(0, .05, s * 4.88); decor.add(f); }
for (const s of [-1, 1]) at(s < 0 ? -1 : 8, s < 0 ? 8 : -1, tufts(5));

// nuvens
const clouds = [];
for (const [x, y, z, s] of [[-9, -1.2, 3, 1.2], [8, -.4, -7, 1], [3, -1.8, 9, .9], [-6, .8, -9, .8], [10, -1.5, 4, .7]]) {
  const g = grp(ball(.6, M.cloud, 0, 0, 0, 14), ball(.45, M.cloud, .6, -.1, .1, 12), ball(.42, M.cloud, -.6, -.12, 0, 12), ball(.35, M.cloud, .2, .3, -.1, 12));
  g.children.forEach(m => (m.castShadow = false)); g.position.set(x, y, z); g.scale.setScalar(s); scene.add(g); clouds.push(g);
}
ambient.push((t, dt) => clouds.forEach((g, i) => { g.position.x += dt * (.12 + i * .03); if (g.position.x > 13) g.position.x = -13; }));

// ---------- Peças: heróis chibi (design próprio) ----------
// sombreamento de desenho animado (3 tons) + contorno escuro
const toonGrad = new THREE.DataTexture(new Uint8Array([95, 175, 255]), 3, 1, THREE.RedFormat);
toonGrad.minFilter = toonGrad.magFilter = THREE.NearestFilter; toonGrad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: toonGrad, ...extra });
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { c: { value: new THREE.Color(0x2a1a14) }, w: { value: .011 } },
  vertexShader: 'uniform float w; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * w, 1.0); }',
  fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }',
  side: THREE.BackSide,
});
const C = {
  skin: toon(0xf7cba6), ink: toon(0x2a1b16), white: toon(0xffffff), mouth: toon(0x7a2626), tongue: toon(0xe86c6c), blush: toon(0xf59a8c),
  metal: toon(0xb9c1cd), metalD: toon(0x7d8695), gold: toon(0xf2bc44), goldD: toon(0xf2bc44, { side: THREE.DoubleSide }),
  wood: toon(0x9b6234), woodD: toon(0x6a3f22), leather: toon(0x7a4a2a), boot: toon(0x4a2f1f), pants: toon(0x5d4c3e),
  beardW: toon(0xeeeae2), beardO: toon(0xd0702e), hairR: toon(0xe5622c, { side: THREE.DoubleSide }), hairB: toon(0x6b3f22),
  orb: toon(0x9ff0ff, { emissive: 0x3fc8ff, emissiveIntensity: .9 }),
  fire: toon(0xffa22e, { emissive: 0xff6a00, emissiveIntensity: 1.3 }), fire2: toon(0xfff07a, { emissive: 0xffd23a, emissiveIntensity: 1.3 }),
  string: toon(0xf2ead8),
};
const TEAM = {
  a: { name: 'Vermelho', css: '#d94a3d', accentHex: 0xff7a5c,
       body: toon(0xdb4b3e), dark: toon(0x9e2f28, { side: THREE.DoubleSide }), accent: toon(0xffb08f) },
  b: { name: 'Azul', css: '#3a6fd8', accentHex: 0x5f9cff,
       body: toon(0x3d72dc), dark: toon(0x29489e, { side: THREE.DoubleSide }), accent: toon(0xa9cdff) },
};
const INFO = {
  P: ['Soldado', 'avança 1 casa (2 na primeira), captura na diagonal'],
  N: ['Arqueira Élfica', 'salta em “L”, passando por cima de tudo'],

// junta as partes por material (bem menos draw calls) e cria o contorno
function bake(g) {
  g.updateMatrixWorld(true);
  const byMat = new Map(), all = [];
  g.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(geo.attributes)) if (k !== 'position' && k !== 'normal') geo.deleteAttribute(k);
    geo.clearGroups(); geo.applyMatrix4(o.matrixWorld);
    if (!byMat.has(o.material)) byMat.set(o.material, []);
    byMat.get(o.material).push(geo);
    if (!o.userData.noOutline) all.push(geo);
  });
  const out = new THREE.Group();
  for (const [mat, geos] of byMat) { const m = new THREE.Mesh(mergeGeometries(geos), mat); m.castShadow = m.receiveShadow = true; out.add(m); }
  out.add(new THREE.Mesh(mergeGeometries(all), outlineMat));

}

// coloca um detalhe na superfície da cabeça (olhos, boca...) — sem contorno

function makePiece(type, team) {

const S = { board: [], pieces: [], turn: 'a', sel: null, moves: [], busy: false, over: false, shake: 0, check: null };

const inside = (c, r) => c >= 0 && c < 8 && r >= 0 && r < 8;

function pseudo(g, c, r, attacksOnly = false) {
  const p = g[c][r], out = [];
  const tryAdd = (x, y) => { if (!inside(x, y)) return false; const q = g[x][y]; if (!q) { out.push([x, y]); return true; } if (q.team !== p.team) out.push([x, y]); return false; };
  const slide = dirs => { for (const [dx, dy] of dirs) for (let k = 1; k < 8 && tryAdd(c + dx * k, r + dy * k); k++); };
  const D = [[1, 1], [1, -1], [-1, 1], [-1, -1]], O = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  switch (p.type) {
    case 'P': {
      const d = p.team === 'a' ? 1 : -1, start = p.team === 'a' ? 1 : 6;
      if (!attacksOnly && inside(c, r + d) && !g[c][r + d]) {
        out.push([c, r + d]);
        if (r === start && !g[c][r + 2 * d]) out.push([c, r + 2 * d]);
      }
      for (const dx of [-1, 1]) { const x = c + dx, y = r + d; if (!inside(x, y)) continue; const q = g[x][y]; if (attacksOnly || (q && q.team !== p.team)) out.push([x, y]); }
      break;
    }
    case 'N': for (const [dx, dy] of [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]]) tryAdd(c + dx, r + dy); break;
    case 'B': slide(D); break;
    case 'R': slide(O); break;
    case 'Q': slide([...D, ...O]); break;
    case 'K': for (const [dx, dy] of [...D, ...O]) tryAdd(c + dx, r + dy); break;
  }

}
function findKing(g, team) { for (let c = 0; c < 8; c++) for (let r = 0; r < 8; r++) { const p = g[c][r]; if (p && p.team === team && p.type === 'K') return [c, r]; } }

  for (let x = 0; x < 8; x++) for (let y = 0; y < 8; y++) { const p = g[x][y]; if (p && p.team === by && pseudo(g, x, y, true).some(m => m[0] === c && m[1] === r)) return true; }
  return false;
}
function legal(c, r) {
  const g = S.board, p = g[c][r];
  return pseudo(g, c, r).filter(([x, y]) => {
    const h = g.map(col => col.slice()); h[x][y] = p; h[c][r] = null;
    const k = findKing(h, p.team); return !attacked(h, k[0], k[1], other(p.team));

}
function anyLegal(team) { for (let c = 0; c < 8; c++) for (let r = 0; r < 8; r++) { const p = S.board[c][r]; if (p && p.team === team && legal(c, r).length) return true; } return false; }

  m.position.copy(pos).add(new THREE.Vector3((Math.random() - .5) * .25, .1 + Math.random() * .3, (Math.random() - .5) * .25)); world.add(m);

  mats.forEach(m => (m.transparent = true));

    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.4;
    const v = new THREE.Vector3(Math.cos(a) * sp, 2 + Math.random() * 3.2, Math.sin(a) * sp);
    const w = new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10);
    m.scale.setScalar(.6 + Math.random() * 1.2); world.add(m);
    fx.push({ m, life: 0, max: 1.3 + Math.random() * .4, update(k, dt) {
      v.y -= 9.8 * dt; m.position.addScaledVector(v, dt);
      if (m.position.y < .07) { m.position.y = .07; v.y *= -.35; v.x *= .6; v.z *= .6; w.multiplyScalar(.6); }
      m.rotation.x += w.x * dt; m.rotation.y += w.y * dt; m.rotation.z += w.z * dt;
      m.material.opacity = k < .6 ? 1 : 1 - (k - .6) / .4;
    } });
  }
  for (let i = 0; i < 10; i++) spark(pos, 0xffffff);
  shockwave(pos, 0xffffff, 5);
  S.shake = 0.16;
  setTimeout(() => toBench(p), 650);
}
// peças capturadas ficam enfileiradas na borda, atrás do próprio time
let benchMinis = [];
const benchCount = { a: 0, b: 0 };
function toBench(p) {
  const i = benchCount[p.team]++, s = p.team === 'a' ? -1 : 1;
  const mini = makePiece(p.type, p.team);
  mini.position.set(-s * (3.5 - i * .5), .05, s * 4.45);
  mini.scale.setScalar(0.001); world.add(mini); benchMinis.push(mini);
  tween(450, k => mini.scale.setScalar(.55 * backOut(k)), () => shockwave(mini.position, 0xffffff, 1));
}

// ---------- Montagem ----------
function addPiece(type, team, c, r, delay) {
  const mesh = makePiece(type, team);
  mesh.userData = { base: sqPos(c, r), hop: 9, lift: 0, sq: 1, size: 1, rot: mesh.rotation.y, ph: Math.random() * 6 };
  world.add(mesh);
  const p = { type, team, c, r, mesh };
  S.board[c][r] = p; S.pieces.push(p);
  tween(700, k => { mesh.userData.hop = 9 * (1 - bounceOut(k)); }, () => shockwave(mesh.userData.base, 0xffffff, 1.5), delay);
  return p;
}
function setup() {
  S.pieces.forEach(p => world.remove(p.mesh));
  benchMinis.forEach(m => world.remove(m)); benchMinis = []; benchCount.a = benchCount.b = 0;
  fx.forEach(f => world.remove(f.m)); fx = [];
  tweens = []; spinners = []; clearMarkers();
  Object.assign(S, { board: Array.from({ length: 8 }, () => Array(8).fill(null)), pieces: [], turn: 'a', sel: null, moves: [], busy: true, over: false, check: null });
  const back = ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'];
  let d = 0;
  for (let c = 0; c < 8; c++) {
    addPiece(back[c], 'a', c, 0, d); addPiece('P', 'a', c, 1, d + 30);
    addPiece(back[c], 'b', c, 7, d + 15); addPiece('P', 'b', c, 6, d + 45);
    d += 70;
  }
  tween(1, () => {}, () => { S.busy = false; }, d + 700);
  document.getElementById('overlay').hidden = true;
  document.getElementById('last').textContent = '';
  updateHud();
}

// ---------- Marcadores ----------
const markers = new THREE.Group(); world.add(markers);
const flat = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, depthWrite: false, side: THREE.DoubleSide });
const sqGeo = new THREE.PlaneGeometry(.9, .9);
const selMark = new THREE.Mesh(sqGeo, flat(0xffe24a, .75)); selMark.rotation.x = -Math.PI / 2; selMark.visible = false; world.add(selMark);
const checkMark = new THREE.Mesh(sqGeo, flat(0xff3b30, .7)); checkMark.rotation.x = -Math.PI / 2; checkMark.visible = false; world.add(checkMark);
const hoverMark = new THREE.Mesh(sqGeo, flat(0xffffff, .28)); hoverMark.rotation.x = -Math.PI / 2; hoverMark.visible = false; world.add(hoverMark);
const dotGeo = new THREE.CircleGeometry(.14, 24), ringGeo = new THREE.RingGeometry(.36, .45, 32);
const dotMat = flat(0x1f3d16, .35), capMat = flat(0xff4a3d, .85);
function clearMarkers() { while (markers.children.length) markers.remove(markers.children[0]); selMark.visible = false; }

function select(p) {
  S.sel = p; S.moves = legal(p.c, p.r); clearMarkers();
  selMark.position.copy(sqPos(p.c, p.r)).setY(.056); selMark.visible = true;
  for (const [x, y] of S.moves) {
    const m = S.board[x][y] ? new THREE.Mesh(ringGeo, capMat) : new THREE.Mesh(dotGeo, dotMat);
    m.rotation.x = -Math.PI / 2; m.position.copy(sqPos(x, y)).setY(.058); markers.add(m);
  }
  const [n, d] = INFO[p.type];
  document.getElementById('info').innerHTML = `<b>${n}</b> — ${d}.<br>${S.moves.length} movimento(s) possível(is).`;
}
function deselect() { S.sel = null; S.moves = []; clearMarkers(); document.getElementById('info').textContent = 'Clique numa peça sua para ver os movimentos.'; }

// ---------- Movimento ----------
const files = 'abcdefgh';
const sqName = (c, r) => files[c] + (r + 1);
function doMove(p, c, r) {
  const from = [p.c, p.r], cap = S.board[c][r];
  deselect(); S.busy = true; S.check = null;
  S.board[p.c][p.r] = null; S.board[c][r] = p; p.c = c; p.r = r;
  document.getElementById('last').textContent = `${TEAM[p.team].name}: ${INFO[p.type][0]} ${sqName(...from)} → ${sqName(c, r)}${cap ? ' ✕ ' + INFO[cap.type][0] : ''}`;

  const ud = p.mesh.userData, start = ud.base.clone(), end = sqPos(c, r);
  const dist = Math.hypot(c - from[0], r - from[1]);
  const isN = p.type === 'N';
  const h = isN ? 1.5 : 0.35 + dist * 0.12, dur = isN ? 650 : 360 + dist * 70;
  let capDone = false, frame = 0;
  // antecipação (agacha) → pulinho em arco → aterrissagem com squash
  tween(110, k => { ud.sq = 1 - .25 * k; }, () => {
    tween(dur, k => {
      const e = ease(k);
      ud.base.lerpVectors(start, end, e);
      ud.hop = h * 4 * k * (1 - k);
      ud.sq = .75 + .25 * Math.min(1, k * 5) + .2 * Math.sin(k * Math.PI);
      if (isN) ud.spin = e * Math.PI * 2;
      if (frame++ % 3 === 0) spark(new THREE.Vector3(ud.base.x, ud.hop * .5, ud.base.z), 0xffffff);
      if (cap && !capDone && k > .82) { capDone = true; shatter(cap); }
    }, () => {
      ud.hop = 0; ud.spin = 0; shockwave(end, 0xffffff, cap ? 3 : 2);
      for (let i = 0; i < 6; i++) spark(end.clone().setY(0), 0xf3e6c8);
      tween(320, k => { ud.sq = 1 - .3 * Math.exp(-4 * k) * Math.cos(k * 14); }, () => { ud.sq = 1; });
      const lastRow = p.team === 'a' ? 7 : 0;
      if (p.type === 'P' && r === lastRow) promote(p); else endTurn();
    });
  });
}
function promote(p) {
  const ud = p.mesh.userData;
  tween(220, k => { ud.size = 1 - k; }, () => {
    world.remove(p.mesh); spinners = spinners.filter(s => s.o.parent);
    p.type = 'Q'; p.mesh = makePiece('Q', p.team);
    p.mesh.userData = { base: sqPos(p.c, p.r), hop: 0, lift: 0, sq: 1, size: 0, rot: p.mesh.rotation.y, ph: ud.ph };
    world.add(p.mesh);
    shockwave(p.mesh.userData.base, 0xffe24a, 4);
    for (let i = 0; i < 20; i++) spark(p.mesh.userData.base.clone().setY(Math.random()), 0xffe24a);
    tween(500, k => { p.mesh.userData.size = backOut(k); }, endTurn);
  });
}
function endTurn() {
  S.turn = other(S.turn); S.busy = false;
  const k = findKing(S.board, S.turn);
  const inCheck = attacked(S.board, k[0], k[1], other(S.turn));
  S.check = inCheck ? k : null;
  if (!anyLegal(S.turn)) {
    S.over = true;
    const ov = document.getElementById('overlay');
    document.getElementById('ovTitle').textContent = inCheck ? 'XEQUE-MATE' : 'EMPATE';
    document.getElementById('ovText').textContent = inCheck ? `O ${TEAM[other(S.turn)].name} vence a partida.` : 'Afogamento — ninguém pode se mover.';
    setTimeout(() => (ov.hidden = false), 900);
  }
  updateHud();
}
function updateHud() {
  const t = TEAM[S.turn];
  document.getElementById('turnTxt').textContent = `Vez do ${t.name}`;
  document.getElementById('dot').style.background = t.css;
  document.getElementById('status').textContent = S.check ? 'XEQUE!' : '';
  if (S.check) { checkMark.position.copy(sqPos(...S.check)).setY(.057); checkMark.visible = true; } else checkMark.visible = false;
}

// ---------- Entrada ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hitP = ray.intersectObjects(S.pieces.map(p => p.mesh), true)[0];
  if (hitP) { let o = hitP.object; while (o.parent !== world) o = o.parent; const p = S.pieces.find(q => q.mesh === o); if (p) return [p.c, p.r]; }
  const hitT = ray.intersectObjects(tiles)[0];
  return hitT ? hitT.object.userData.sq : null;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const sq = pick(e); if (!sq || S.busy || S.over) return;
  const [c, r] = sq, p = S.board[c][r];
  if (S.sel && S.moves.some(m => m[0] === c && m[1] === r)) return doMove(S.sel, c, r);
  if (p && p.team === S.turn && p !== S.sel) select(p); else deselect();
});
renderer.domElement.addEventListener('pointermove', e => {
  const sq = pick(e);
  hoverMark.visible = !!sq;
  if (sq) hoverMark.position.copy(sqPos(...sq)).setY(.055);
  const p = sq && S.board[sq[0]][sq[1]];
  const can = sq && ((p && p.team === S.turn) || S.moves.some(m => m[0] === sq[0] && m[1] === sq[1]));
  renderer.domElement.style.cursor = can ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('wheel', e => {
  camera.zoom = Math.min(2.5, Math.max(.6, camera.zoom * (e.deltaY > 0 ? .9 : 1.1))); camera.updateProjectionMatrix();
}, { passive: true });
const rotate = d => (camTarget += d * Math.PI / 2);
addEventListener('keydown', e => { if (e.key === 'q' || e.key === 'Q') rotate(-1); if (e.key === 'e' || e.key === 'E') rotate(1); });
document.getElementById('rotL').onclick = () => rotate(-1);
document.getElementById('rotR').onclick = () => rotate(1);
document.getElementById('reset').onclick = setup;
document.getElementById('ovBtn').onclick = setup;

// ---------- Loop ----------
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.1), time = clock.elapsedTime;

  for (const tw of tweens.slice()) {
    tw.t += dt * 1000; if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done && tw.done(); }
  }
  for (const f of fx.slice()) {
    f.life += dt; const k = Math.min(1, f.life / f.max); f.update(k, dt);
    if (k >= 1) { world.remove(f.m); fx.splice(fx.indexOf(f), 1); }
  }
  for (const s of spinners) { s.o.rotation.y += s.ry * dt; if (s.bob) s.o.position.y = s.y0 + Math.sin(time * 2 + s.ph) * s.bob; }
  ambient.forEach(f => f(time, dt));
  for (const p of S.pieces) {
    const ud = p.mesh.userData, sel = S.sel === p;
    ud.lift += ((sel ? .3 : 0) - ud.lift) * Math.min(1, dt * 10);
    const bob = sel ? Math.sin(time * 5) * .04 : 0;
    p.mesh.position.set(ud.base.x, ud.base.y + ud.hop + ud.lift + bob, ud.base.z);
    p.mesh.rotation.y = camAng + (ud.spin || 0);   // bonecos sempre olham para a câmera
    const s = ud.sq * (1 + Math.sin(time * 2.4 + ud.ph) * .02), z = ud.size * 1.32;   // respiração
    p.mesh.scale.set(z / Math.sqrt(s), z * s, z / Math.sqrt(s));
  }
  benchMinis.forEach(m => (m.rotation.y = camAng));
  const pulse = 1 + Math.sin(time * 6) * .1;
  markers.children.forEach(m => m.scale.setScalar(pulse));
  checkMark.material.opacity = .45 + Math.sin(time * 8) * .3;

  camAng += (camTarget - camAng) * Math.min(1, dt * 6);
  S.shake *= Math.pow(.02, dt);
  const sx = (Math.random() - .5) * S.shake, sy = (Math.random() - .5) * S.shake;
  camera.position.set(Math.cos(EL) * Math.sin(camAng) * DIST + sx, Math.sin(EL) * DIST + sy - .4, Math.cos(EL) * Math.cos(camAng) * DIST);
  camera.lookAt(sx, -.4 + sy, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
// gancho de depuração (console): window.jogo
window.jogo = { S, legal, camera, sqPos, world, doMove, select };
setup();
loop();
</script>
</body>
