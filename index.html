<style>

  button:active { transform:translateY(3px); box-shadow:0 1px 0 #0c1714; }
  #help { position:fixed; left:20px; bottom:20px; font-size:13px; color:var(--dim); background:var(--panel); padding:8px 12px; border-radius:12px; }
  #overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(4,10,9,.5); backdrop-filter:blur(3px); }
  #overlay[hidden] { display:none; }
  .card { text-align:center; padding:30px 40px; border-radius:22px; background:#172925; border:1px solid rgba(160,255,190,.18); box-shadow:0 24px 50px rgba(0,0,0,.45); }

  .card p { color:var(--dim); margin:0 0 20px; font-size:16px; }

    /* celular: o painel vira uma barrinha fina no topo */
    #hud { top:10px; left:50%; transform:translateX(-50%); width:auto; max-width:calc(100vw - 20px); padding:7px 14px; border-radius:999px;
      display:flex; align-items:center; gap:10px; white-space:nowrap; }
    #hud .t1, #hud .t2, #hud .lead, #info, #last { display:none; }
    .turn { font-size:14px; gap:8px; } .dot { width:12px; height:12px; border-width:2px; }

  }

function mergeStatic(root) {

    for (const k of Object.keys(geo.attributes)) if (k !== 'position' && k !== 'normal' && !(m.map && k === 'uv') && !(m.vertexColors && k === 'color')) geo.deleteAttribute(k);

const VCM = {

  walk(node); return out;
}

  const out = [];

  walk(node); return out;
}

    const keepUV = !!o.material.map;
    for (const k of Object.keys(geo.attributes)) if (k !== 'position' && k !== 'normal' && !(keepUV && k === 'uv')) geo.deleteAttribute(k);
    geo.clearGroups(); geo.applyMatrix4(inv.clone().multiply(o.matrixWorld));
    const key = matKey(o.material);

    const u = aiMake(B, m), v = -aiSearch(B, other(AI), mode - 1, -Infinity, Infinity) + Math.random() * noise; aiUndo(B, m, u);
    if (v > bv) { bv = v; best = m; }
  }
  return best;
}
function aiPlay() {
  if (!aiTurn() || S.busy) return;
  S.busy = true;
  const token = aiToken;
  document.getElementById('info').innerHTML = '<b>O computador está pensando…</b>';
  setTimeout(() => {
    if (token !== aiToken) return;
    S.busy = false;
    if (!aiTurn()) { deselect(); return; }
    const m = aiBest();
    deselect();
    if (m) doMove(S.board[m[0]][m[1]], m[2], m[3]);
  }, 500);
}
const modeBtn = document.getElementById('mode');
const showMode = () => { modeBtn.textContent = MODES.find(m => m[0] === mode)[1]; };
modeBtn.onclick = () => {
  const i = MODES.findIndex(m => m[0] === mode);
  mode = MODES[(i + 1) % MODES.length][0];
  try { localStorage.setItem('xp-modo', String(mode)); } catch (e) {}
  showMode(); updateHud(); aiPlay();
};
showMode();

// ---------- Online: dois celulares, jogadas trocadas pelo ntfy.sh (sem servidor próprio) ----------
// Cada sala é um tópico do ntfy com um código aleatório. Mensagens: reset (nova partida), mv (jogada), hi/here (presença).
// O ntfy guarda as mensagens por ~12 h, então quem recarrega a página reconstrói a partida a partir delas.
const NTFY = 'https://ntfy.sh/';
const net = { on: false, code: null, role: null, game: null, es: null, seen: new Set(), queue: [], peerAt: 0, me: Math.random().toString(36).slice(2, 10), lastId: null };
const netEl = id => document.getElementById(id);
const topic = () => 'xprisma-' + net.code;
const roomLink = () => location.origin + location.pathname + '?sala=' + net.code;
const newCode = () => { const A = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(10)); r.forEach(v => (s += A[v % A.length])); return s; };
const myTurn = () => !net.on || S.turn === net.role;
const peerOnline = () => Date.now() - net.peerAt < 150000;

function netSend(msg) {
  msg.from = net.me;
  return fetch(NTFY + topic(), { method: 'POST', body: JSON.stringify(msg) }).catch(() => netStatus('sem conexão — tentando de novo…'));
}
function parse(m) { try { const d = JSON.parse(m.message); return d && typeof d === 'object' ? d : null; } catch (e) { return null; } }
const validMove = m => Array.isArray(m) && m.length === 4 && m.every(v => Number.isInteger(v) && v >= 0 && v < 8);

// aplica uma jogada sem animação (usado para reconstruir a partida ao entrar/recarregar)
function applyInstant([c, r, x, y]) {
  const p = S.board[c][r];
  if (!p || p.team !== S.turn || !legal(c, r).some(m => m[0] === x && m[1] === y)) return false;
  const cap = S.board[x][y];
  if (cap) { world.remove(cap.mesh); S.pieces = S.pieces.filter(q => q !== cap); toBench(cap); }
  S.board[c][r] = null; S.board[x][y] = p; p.c = x; p.r = y; p.mesh.userData.base.copy(sqPos(x, y));
  if (p.type === 'P' && y === (p.team === 'a' ? 7 : 0)) {
    world.remove(p.mesh); p.type = 'Q'; const ph = p.mesh.userData.ph;
    p.mesh = makePiece('Q', p.team); Object.assign(p.mesh.userData, { base: sqPos(x, y), hop: 0, lift: 0, sq: 1, size: 1, ph }); p.mesh.rotation.order = 'YXZ'; world.add(p.mesh);
  }
  S.hist.push([c, r, x, y]); S.turn = other(S.turn);
  return true;
}
function rebuild(moves) {
  setup();
  for (const m of moves) if (!applyInstant(m)) break;
  evalPosition();
}
// lê tudo que já foi trocado na sala e monta a partida atual
async function loadRoom() {
  const res = await fetch(NTFY + topic() + '/json?poll=1&since=all');
  const txt = await res.text();
  let game = null, moves = [];
  for (const line of txt.split('\n')) {
    if (!line.trim()) continue;
    let m; try { m = JSON.parse(line); } catch (e) { continue; }
    if (m.event !== 'message') continue;
    net.seen.add(m.id); net.lastId = m.id;
    const d = parse(m); if (!d) continue;
    if (d.t === 'reset' && typeof d.g === 'string') { game = d.g; moves = []; }
    else if (d.t === 'mv' && d.g === game && d.n === moves.length && validMove(d.m)) moves.push(d.m);
    else if ((d.t === 'hi' || d.t === 'here') && d.from !== net.me && d.role !== net.role && Date.now() / 1000 - m.time < 150) net.peerAt = m.time * 1000;
  }
  return { game, moves };
}
function onNetMessage(m) {
  if (net.seen.has(m.id)) return; net.seen.add(m.id); net.lastId = m.id;
  const d = parse(m); if (!d) return;
  if (d.from === net.me && d.t !== 'reset') return;   // o próprio reset volta para todos convergirem no último
  if (d.t === 'hi' || d.t === 'here') {
    if (d.role === net.role) return;
    const was = peerOnline(); net.peerAt = Date.now();
    if (d.t === 'hi') netSend({ t: 'here', role: net.role });
    if (!was) netStatus(); return;
  }
  net.queue.push(d);
}
// processa jogadas/resets que chegaram, um de cada vez, quando nada está animando
setInterval(() => {
  if (!net.on || S.busy || !net.queue.length) return;
  const d = net.queue.shift();
  if (d.t === 'reset' && typeof d.g === 'string' && d.g !== net.game) { net.game = d.g; setup(); netStatus(); return; }
  if (d.t !== 'mv' || d.g !== net.game || !validMove(d.m)) return;
  if (d.n < S.hist.length) return;                       // já aplicada
  if (d.n > S.hist.length) { resync(); return; }          // perdemos alguma: reconstrói
  const [c, r, x, y] = d.m, p = S.board[c][r];
  if (S.turn === net.role || !p || p.team !== S.turn || !legal(c, r).some(q => q[0] === x && q[1] === y)) return;
  deselect(); doMove(p, x, y);
}, 150);
async function resync() {
  try { const { game, moves } = await loadRoom(); net.queue = []; if (game) { net.game = game; rebuild(moves); } } catch (e) { netStatus('sem conexão — tentando de novo…'); }
}
function subscribe() {
  if (net.es) net.es.close();
  net.es = new EventSource(NTFY + topic() + '/sse?since=' + (net.lastId || 'all'));
  net.es.onmessage = e => { try { onNetMessage(JSON.parse(e.data)); } catch (err) {} };
  net.es.onopen = () => netStatus();
  net.es.onerror = () => netStatus('reconectando…');
}
async function enterRoom(code, role, fresh, keep = true) {
  net.on = true; net.code = code; net.role = role; net.queue = []; net.seen = new Set(); net.lastId = null; net.peerAt = 0;
  if (keep) try { const all = JSON.parse(localStorage.getItem('xp-salas') || '{}'); all[code] = role; localStorage.setItem('xp-salas', JSON.stringify(all)); } catch (e) {}
  history.replaceState(null, '', '?sala=' + code);
  mode = 'pvp'; aiToken++; modeBtn.style.display = 'none'; netEl('netBtn').textContent = '🌐 Sala';
  camTarget = role === 'a' ? Math.PI / 4 + Math.PI : Math.PI / 4;   // seu time começa do lado esquerdo da tela
  netStatus('conectando…');
  if (fresh) { net.game = newCode(); setup(); await netSend({ t: 'reset', g: net.game }); }
  else {
    try {
      const { game, moves } = await loadRoom();
      if (game) { net.game = game; rebuild(moves); }
      else if (role === 'a') { net.game = newCode(); setup(); await netSend({ t: 'reset', g: net.game }); }
      else { net.game = null; setup(); }   // o Azul espera o Vermelho começar a partida
    } catch (e) { netStatus('não consegui abrir a sala'); }
  }
  subscribe();
  netSend({ t: 'hi', role });
  netStatus(); showNet();
}
function leaveRoom() {
  if (net.es) net.es.close();
  Object.assign(net, { on: false, code: null, role: null, game: null, es: null, queue: [] });
  history.replaceState(null, '', location.pathname);
  try { const m = localStorage.getItem('xp-modo'); mode = m ? (m === 'pvp' ? 'pvp' : +m) : 2; } catch (e) { mode = 2; } showMode();
  modeBtn.style.display = ''; netEl('netBtn').textContent = '🌐 Online'; netEl('netLine').textContent = '';
  camTarget = camAng + Math.atan2(Math.sin(CAM_RED_LEFT - camAng), Math.cos(CAM_RED_LEFT - camAng));   // volta: Vermelho à esquerda
  setup(); showNet();
}
setInterval(() => { if (net.on) netSend({ t: 'here', role: net.role }); }, 60000);
setInterval(() => net.on && netStatus(), 10000);
function netStatus(extra) {
  if (!net.on) { netEl('netLine').textContent = ''; return; }
  const ok = !extra && peerOnline();
  netEl('netLine').innerHTML = `🌐 <span class="nl">${extra || (ok ? 'amigo online ✓' : 'esperando amigo…')}</span><b class="ns">${ok ? '✓' : extra ? '⟳' : '…'}</b>`;
  updateHud();
  const msg = netEl('netMsg'); if (msg) msg.innerHTML = netMsgText();
}
function newGameOnline() { net.game = newCode(); net.queue = []; setup(); netSend({ t: 'reset', g: net.game }); }

// painel "Jogar online"
const netMsgText = () => `Você é o <b>${TEAM[net.role].name}</b>. ` + (peerOnline() ? 'Seu amigo está na sala ✓ Link da sala:' : 'Mande este link para o seu amigo:');
function showNet() {
  const body = netEl('netBody');
  if (!net.on) {
    body.innerHTML = '<p>Crie uma sala e mande o link para o seu amigo. Quem cria joga com o <b>Vermelho</b>; quem abre o link joga com o <b>Azul</b>.</p>'
      + '<div class="row"><button id="netCreate">Criar sala</button><button id="netClose" class="ghost">Fechar</button></div>';
    netEl('netCreate').onclick = () => enterRoom(newCode(), 'a', true);
  } else {
    body.innerHTML = `<p id="netMsg">${netMsgText()}</p>`
      + `<input id="netLink" readonly value="${roomLink()}">`
      + '<div class="row"><button id="netShare">Compartilhar</button><button id="netCopy" class="ghost">Copiar</button></div>'
      + '<div class="row"><button id="netLeave" class="ghost">Sair da sala</button><button id="netClose" class="ghost">Fechar</button></div>';
    netEl('netShare').onclick = async () => {
      try { if (navigator.share) await navigator.share({ title: 'Xadrez Prisma', text: 'Bora jogar xadrez? Entra na minha sala:', url: roomLink() }); else throw 0; }
      catch (e) { netEl('netCopy').click(); }
    };
    netEl('netCopy').onclick = async () => {
      const i = netEl('netLink'); i.select();
      try { await navigator.clipboard.writeText(roomLink()); } catch (e) { document.execCommand && document.execCommand('copy'); }
      netEl('netCopy').textContent = 'Copiado!';
    };
    netEl('netLeave').onclick = leaveRoom;
  }
  netEl('netClose').onclick = () => (netEl('net').hidden = true);
}
netEl('netBtn').onclick = () => { showNet(); netEl('net').hidden = false; };
// entrou por um link de sala?
{
  const q = new URLSearchParams(location.search), code = (q.get('sala') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (code.length >= 6) {
    let role = 'b', keep = true;
    try { role = JSON.parse(localStorage.getItem('xp-salas') || '{}')[code] || 'b'; } catch (e) {}
    if (q.get('papel') === 'a' || q.get('papel') === 'b') { role = q.get('papel'); keep = false; }   // só para testes
    setTimeout(() => enterRoom(code, role, false, keep).then(() => { showNet(); netEl('net').hidden = false; }), 0);
  }
}

// ---------- Entrada ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hitP = ray.intersectObjects(S.pieces.map(p => p.mesh), true)[0];
  if (hitP) { let o = hitP.object; while (o.parent !== world) o = o.parent; const p = S.pieces.find(q => q.mesh === o); if (p) return [p.c, p.r]; }
  const hitT = ray.intersectObjects(tiles)[0];
  return hitT ? hitT.object.userData.sq : null;
}
function playerMove(p, c, r) {   // jogada feita por quem está neste aparelho
  if (net.on) netSend({ t: 'mv', g: net.game, n: S.hist.length, m: [p.c, p.r, c, r] });
  doMove(p, c, r);
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const sq = pick(e); if (!sq || S.busy || S.over || aiTurn() || !myTurn()) return;
  const [c, r] = sq, p = S.board[c][r];
  if (S.sel && S.moves.some(m => m[0] === c && m[1] === r)) return playerMove(S.sel, c, r);
  if (p && p.team === S.turn && p !== S.sel) select(p); else deselect();
});
renderer.domElement.addEventListener('pointermove', e => {
  const sq = pick(e);
  hoverMark.visible = !!sq;
  if (sq) hoverMark.position.copy(sqPos(...sq)).setY(.055);
  const p = sq && S.board[sq[0]][sq[1]];
  const can = sq && !aiTurn() && myTurn() && ((p && p.team === S.turn) || S.moves.some(m => m[0] === sq[0] && m[1] === sq[1]));
  renderer.domElement.style.cursor = can ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('wheel', e => {
  camera.zoom = Math.min(3.5, Math.max(.6, camera.zoom * (e.deltaY > 0 ? .9 : 1.1))); camera.updateProjectionMatrix();
}, { passive: true });
const rotate = d => (camTarget += d * Math.PI / 2);
addEventListener('keydown', e => { if (e.key === 'q' || e.key === 'Q') rotate(-1); if (e.key === 'e' || e.key === 'E') rotate(1); });
document.getElementById('rotL').onclick = () => rotate(-1);
document.getElementById('rotR').onclick = () => rotate(1);
document.getElementById('reset').onclick = () => (net.on ? newGameOnline() : setup());
document.getElementById('ovBtn').onclick = () => (net.on ? newGameOnline() : setup());
// pinça com dois dedos = zoom (celular)
const touches = new Map(); let pinch0 = 0, zoom0 = 1;
const tdist = () => { const [a, b] = [...touches.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
renderer.domElement.addEventListener('pointerdown', e => { touches.set(e.pointerId, [e.clientX, e.clientY]); if (touches.size === 2) { pinch0 = tdist(); zoom0 = camera.zoom; downAt = null; } });
renderer.domElement.addEventListener('pointermove', e => { if (!touches.has(e.pointerId)) return; touches.set(e.pointerId, [e.clientX, e.clientY]); if (touches.size === 2 && pinch0) { camera.zoom = Math.min(3.5, Math.max(.6, zoom0 * tdist() / pinch0)); camera.updateProjectionMatrix(); } });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) renderer.domElement.addEventListener(ev, e => { touches.delete(e.pointerId); if (touches.size < 2) pinch0 = 0; });

// ---------- Loop ----------
const clock = new THREE.Clock();
function loop() {
  const raw = Math.min(clock.getDelta(), 0.1) * (window.jogo.speed ?? 1), time = clock.elapsedTime;   // jogo.speed: câmera lenta p/ depurar
  let dt = raw;   // tempo do jogo: congela no hitstop, desacelera na câmera lenta
  if (timeFx.stop > 0) { timeFx.stop -= raw; dt = 0; } else if (timeFx.slow > 0) { timeFx.slow -= raw; dt = raw * timeFx.slowK; }
  fpsTick(raw);

  for (const tw of tweens.slice()) {
    tw.t += dt * 1000; if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done && tw.done(); }
  }
  for (const f of fx.slice()) {
    f.life += dt; const k = Math.min(1, f.life / f.max); f.update(k, dt);
    if (k >= 1) { world.remove(f.m); fx.splice(fx.indexOf(f), 1); }
  }
  for (const s of spinners) { s.o.rotation.y += s.ry * dt; if (s.bob) s.o.position.y = s.y0 + Math.sin(time * 2 + s.ph) * s.bob; }
  ambient.forEach(f => f(time, raw));
  for (const p of S.pieces) {
    const ud = p.mesh.userData, sel = S.sel === p, B = (ud.an && ud.an.body) || NOP;
    ud.lift += ((sel ? .3 : 0) - ud.lift) * Math.min(1, dt * 10);
    const bob = sel ? Math.sin(time * 5) * .04 : 0;
    p.mesh.position.set(ud.base.x + (B.x || 0), ud.base.y + ud.hop + ud.lift + bob + (B.hop || 0), ud.base.z);
    // bonecos olham para a câmera; ao andar/atacar viram para o alvo (lookW) e inclinam o corpo
    p.mesh.rotation.y = (ud.lookW ? camAng + Math.atan2(Math.sin(ud.lookA - camAng), Math.cos(ud.lookA - camAng)) * ud.lookW : camAng) + (ud.spin || 0);
    p.mesh.rotation.x = (ud.lean || 0) + ((ud.atk && ud.atk.lean) || 0) + (B.lean || 0);
    p.mesh.rotation.z = B.roll || 0;
    animate(p, dt, time);
    const s = ud.sq * (1 + Math.sin(time * 2.4 + ud.ph) * .02), z = ud.size * 1.32;   // respiração
    p.mesh.scale.set(z / Math.sqrt(s), z * s, z / Math.sqrt(s));
  }
  benchMinis.forEach(m => (m.rotation.y = camAng));
  const pulse = 1 + Math.sin(time * 6) * .1;
  moveMat.opacity = .45 + Math.sin(time * 4) * .08; capMat.opacity = .5 + Math.sin(time * 6) * .1;
  markers.children.forEach(m => (m.scale.y = pulse));
  checkMark.material.opacity = .45 + Math.sin(time * 8) * .3;

  camAng += (camTarget - camAng) * Math.min(1, raw * 6);
  S.shake *= Math.pow(.02, raw);
  camFocus.lerp(camFocusT, Math.min(1, raw * 3));
  if (zoomT !== null) { camera.zoom += (zoomT - camera.zoom) * Math.min(1, raw * 3); camera.updateProjectionMatrix(); if (Math.abs(zoomT - camera.zoom) < .002) zoomT = null; }
  const sx = (Math.random() - .5) * S.shake, sy = (Math.random() - .5) * S.shake;
  camera.position.set(Math.cos(EL) * Math.sin(camAng) * DIST + sx + camFocus.x, Math.sin(EL) * DIST + sy - .4, Math.cos(EL) * Math.cos(camAng) * DIST + camFocus.z);
  camera.lookAt(sx + camFocus.x, -.4 + sy, camFocus.z);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
// gancho de depuração (console): window.jogo
window.jogo = { S, legal, camera, sqPos, world, doMove, select, play: (c, r, x, y) => playerMove(S.board[c][r], x, y), net };
setup();
loop();
